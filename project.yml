# XcodeGen spec — run `xcodegen generate` to create StarterApp.xcodeproj.
# The .xcodeproj is generated, not committed, so merge conflicts in project files go away.
name: StarterApp

options:
  bundleIdPrefix: com.dreamconceptsai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Put your 10-character Apple Developer Team ID here (or pick it in Xcode's Signing tab).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  StarterApp:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dreamconceptsai.starterapp
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Starter
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  StarterAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/StarterAppTests
    dependencies:
      - target: StarterApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dreamconceptsai.starterapp.tests
        GENERATE_INFOPLIST_FILE: YES

  StarterAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/StarterAppUITests
    dependencies:
      - target: StarterApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dreamconceptsai.starterapp.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: StarterApp

schemes:
  StarterApp:
    build:
      targets:
        StarterApp: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - StarterApp
      targets:
        - StarterAppTests
        - StarterAppUITests
    archive:
      config: Release
